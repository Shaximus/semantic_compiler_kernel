name: Kestrel Lab

on:
  push:
    branches:
      - kestrel/lab-3cycle
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: semantic_compiler
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema
      - name: Run full suite
        working-directory: semantic_compiler
        env:
          PYTHONPATH: ${{ runner.temp }}
        run: |
          ln -s "$GITHUB_WORKSPACE/semantic_compiler" "${RUNNER_TEMP}/semantic_compiler"
          python -m unittest discover -s tests -v
