name: CI

# Adapted from the Kestrel Lab workflow: run pytest and unittest on main pushes and PRs.
#
# SC-SOV-TRADE-001: the functional crypto, PKCS#11 (SoftHSM2), RFC 3161,
# mTLS and ceremony tests run in every matrix entry with
# SOV_TRADE_REQUIRE_FUNCTIONAL=1, so a missing dependency FAILS instead of
# skipping. A separate job runs without `cryptography` and proves the
# package refuses to import. The `test` job aggregates both so the
# required status check keeps its name.

on:
  push:
    branches:
      - main
      - kestrel/v3
  pull_request:
    branches:
      - main
      - kestrel/v3
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional:
    name: functional (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml: requires-python = ">=3.10"
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    env:
      SOV_TRADE_REQUIRE_FUNCTIONAL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: semantic_compiler
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SoftHSM2 and PKCS#11 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends softhsm2 opensc
          softhsm2-util --version
          pkcs11-tool --version 2>&1 | head -n 1 || true
          openssl version
      - name: Install pinned Python dependencies (hash-locked)
        working-directory: semantic_compiler
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/sov-trade-ci.lock
          python -c "import cryptography; print('cryptography', cryptography.__version__)"
      - name: Initialise a SoftHSM2 test token (test PINs, generated per run)
        run: |
          mkdir -p "$RUNNER_TEMP/softhsm/tokens"
          printf 'directories.tokendir = %s\nobjectstore.backend = file\nlog.level = ERROR\n' \
            "$RUNNER_TEMP/softhsm/tokens" > "$RUNNER_TEMP/softhsm/softhsm2.conf"
          echo "SOFTHSM2_CONF=$RUNNER_TEMP/softhsm/softhsm2.conf" >> "$GITHUB_ENV"
          PIN="$(openssl rand -hex 16)"; SO_PIN="$(openssl rand -hex 16)"
          echo "::add-mask::$PIN"; echo "::add-mask::$SO_PIN"
          SOFTHSM2_CONF="$RUNNER_TEMP/softhsm/softhsm2.conf" softhsm2-util \
            --init-token --free --label sov-ci-test --pin "$PIN" --so-pin "$SO_PIN"
          echo "SOV_TRADE_PKCS11_USER_PIN=$PIN" >> "$GITHUB_ENV"
          echo "SOV_TRADE_PKCS11_TOKEN_LABEL=sov-ci-test" >> "$GITHUB_ENV"
          for m in /usr/lib/softhsm/libsofthsm2.so /usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so; do
            if [ -f "$m" ]; then echo "SOV_TRADE_PKCS11_LIBRARY=$m" >> "$GITHUB_ENV"; break; fi
          done
      - name: Run full suite (sov_trade skips fail)
        working-directory: semantic_compiler
        env:
          PYTHONPATH: ${{ runner.temp }}
        run: |
          # The repository root is the package: make it importable as semantic_compiler.
          ln -s "$GITHUB_WORKSPACE/semantic_compiler" "${RUNNER_TEMP}/semantic_compiler"
          python -m pytest tests -q -rsx
          python -m unittest discover
      - name: Assert zero sov_trade skips
        working-directory: semantic_compiler
        env:
          PYTHONPATH: ${{ runner.temp }}
        run: |
          python -m pytest tests -q -rs -k "sov_trade" -p no:cacheprovider > "$RUNNER_TEMP/sov.txt" 2>&1 || { cat "$RUNNER_TEMP/sov.txt"; exit 1; }
          tail -n 3 "$RUNNER_TEMP/sov.txt"
          if grep -Eq '(^SKIPPED| skipped)' "$RUNNER_TEMP/sov.txt"; then
            echo "::error::sov_trade tests skipped"; exit 1
          fi
      - name: HSM evidence (pkcs11-tool, test token only)
        working-directory: semantic_compiler
        env:
          PYTHONPATH: ${{ runner.temp }}
        run: python scripts/sov_trade/hsm_evidence.py

  no-cryptography:
    name: refuses import without cryptography
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: semantic_compiler
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies (no cryptography)
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema pyyaml pytest
          if python -c "import cryptography" 2>/dev/null; then
            echo "::error::cryptography is installed in the no-cryptography job"; exit 1
          fi
      - name: Prove sov_trade refuses to import
        env:
          PYTHONPATH: ${{ runner.temp }}
        run: |
          ln -s "$GITHUB_WORKSPACE/semantic_compiler" "${RUNNER_TEMP}/semantic_compiler"
          set +e
          python -c "import semantic_compiler.sov_trade" 2> "$RUNNER_TEMP/refuse.txt"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/refuse.txt"
          test "$rc" -ne 0
          grep -q "ImportError" "$RUNNER_TEMP/refuse.txt"
          grep -qi "cryptography" "$RUNNER_TEMP/refuse.txt"
      - name: Run full suite without cryptography
        working-directory: semantic_compiler
        env:
          PYTHONPATH: ${{ runner.temp }}
        run: |
          python -m pytest tests -q -rs
          python -m pytest tests/test_sc_sov_trade_001_crypto_required.py -q -rs
          python -m unittest discover

  test:
    # Aggregate status: keeps the required check name `test`.
    name: test
    if: always()
    needs: [functional, no-cryptography]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          echo "functional=${{ needs.functional.result }} no-cryptography=${{ needs.no-cryptography.result }}"
          test "${{ needs.functional.result }}" = "success"
          test "${{ needs.no-cryptography.result }}" = "success"
