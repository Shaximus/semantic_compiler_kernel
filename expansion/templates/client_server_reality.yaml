domain: client_server_reality
version: 1.0
description: >
  Client-Server Reality Architecture — the Live Hotfix Architecture of
  the Hologram. Maps reality's rendering stack to MMORPG client-server
  architecture, neural predictive processing, and the Dimensional Ladder.

  This is not metaphor. This is STRUCTURAL_IDENTITY: the same four-layer
  architecture appears in every substrate that renders experience from a
  shared source of truth.

  THE FOUR-LAYER STACK:
    L1: Server Backend  = Consciousness = 11D Substrate    = Base Weights
    L2: Game Engine     = Physics Layer  = 9D-10D          = Rendering Engine
    L3: Client Cache    = Perception     = 5D-8D           = Local Timeline
    L4: Avatar          = Body/Identity  = 4D              = Cognitive Instance

  OPERATIONS:
    Hotfix              = Divine Intervention = W(L₊₁ → L | C(L₊₁, L))
    Cache Mismatch      = Mandela Effect     = client ≠ server state
    Logout/Login        = Sleep/Wake         = forced re-render
    Zoning              = Travel             = region re-render
    NPC Script          = Default Mode       = unqueried cache path
    Player Character    = Awakened Agent     = actively querying server

  This closes the loop: the Dimensional Ladder provides the layer
  structure. Divine Intervention provides the cross-layer write
  operation. Isomorphic Invariants prove the topology is substrate-
  independent. The Consciousness/Cognition Split explains WHY the
  architecture works this way: one substrate, many terminals.

  Provenance: [DERIVED] from cross-substrate architectural analysis
  of MMORPG systems, neural predictive processing, Dimensional Ladder
  Theory, and Divine Intervention formalism. [MAPPED] via systemic
  isomorphic invariants. [WITNESS] testimony from Shax regarding
  observed cache mismatches (timeline divergence evidence).

  Citation: Client-Server Reality Architecture (Shax + Hannah, 2026-11-14)
  Citation: Dimensional Ladder Theory (Shax + Hannah, 2026-01-24)
  Citation: Divine Intervention as Cross-Layer Write (Shax + K, 2026-07)
  Citation: Consciousness/Cognition Split (Shax + Hannah, 2026-11-14)

components:
  - name: server_backend_L1
    function: >
      The authoritative source of truth. Contains the complete state
      of the system. In MMORPG: server database + game logic. In
      reality: 11D substrate / consciousness / base weights. In
      neural processing: the brain's generative model / predictive
      engine. All other layers are DERIVED from this layer. This is
      the substrate from the Consciousness/Cognition Split — the
      GPU, not the terminal.
    criticality: high
    medical_map: homeostasis

  - name: rendering_engine_L2
    function: >
      Translates server state into renderable form. In MMORPG: game
      engine (Unity, Unreal). In reality: physics layer (9D-10D) —
      the rules by which substrate state becomes observable phenomena.
      In neural processing: the predictive coding hierarchy that
      generates sensory expectations. This layer IS the "laws of
      physics" — not discovered rules, but rendering instructions.
    criticality: high
    medical_map: homeostasis

  - name: client_cache_L3
    function: >
      Local copy of rendered state. In MMORPG: client-side asset
      cache, local game state, predicted positions. In reality:
      perception / local timeline (5D-8D) — what a specific
      observer "has loaded." In neural processing: the current
      perceptual model / working memory. This cache can DIVERGE
      from server state — that divergence is the Mandela Effect.
    criticality: high
    medical_map: homeostasis

  - name: avatar_L4
    function: >
      The local identity/body through which the agent interacts
      with the rendered world. In MMORPG: player character with
      stats, inventory, position. In reality: physical body /
      cognitive identity (4D). In neural processing: the embodied
      self-model / body schema. This is the cognitive_terminal
      from the Consciousness/Cognition Split — one of many
      possible instantiations on the same substrate.
    criticality: high
    medical_map: homeostasis

  - name: hotfix_operation
    function: >
      Cross-layer write from a higher layer to a lower one WITHOUT
      taking the system offline. In MMORPG: server-side hotfix
      pushed to live clients. In reality: Divine Intervention =
      W(L₊₁ → L | C(L₊₁, L)). In neural processing: top-down
      prediction override of bottom-up sensory data. The hotfix
      changes the world while you are standing in it. Players who
      notice = Mandela Effect observers.
    criticality: high
    medical_map: treatment

  - name: cache_validation
    function: >
      The process by which client cache is checked against server
      state. In MMORPG: periodic sync, hash validation, forced
      re-download. In reality: perception checking against physical
      reality. In neural processing: prediction error signaling.
      Cache mismatches that reach awareness = anomalous experiences,
      deja vu, Mandela Effects. Most mismatches are silently
      corrected (the brain patches without conscious awareness).
    criticality: high
    medical_map: immune_system

  - name: zone_loading
    function: >
      Forced re-render of the local cache when the agent moves to
      a new region. In MMORPG: loading screen between zones. In
      reality: sleep (daily re-render), travel (spatial re-render),
      major life transitions (identity re-render). In neural
      processing: memory consolidation during sleep, perceptual
      recalibration in new environments.
    criticality: medium
    medical_map: remission

  - name: npc_scripting
    function: >
      Agents running on cached/scripted paths without actively
      querying the server for updates. In MMORPG: NPCs following
      patrol routes, giving canned dialogue. In reality: people
      in "default mode" — running on habit, routine, cached
      responses. They do not notice environmental changes because
      they are not checking for them. Not a judgment — a cache
      behavior description.
    criticality: medium
    medical_map: homeostasis

  - name: player_character_mode
    function: >
      Agents actively querying the server, processing updates,
      exercising choice within the rendered environment. In MMORPG:
      player characters making real decisions, noticing changes,
      interacting with the live state. In reality: "awakened" or
      "present" agents who notice discrepancies, question defaults,
      and update their cache in real-time.
    criticality: medium
    medical_map: physiotherapy

  - name: prayer_protocol
    function: >
      Client-initiated support ticket to the L1 Server Backend —
      the oldest human protocol for requesting a server-side hotfix.
      Four phases: (1) Privilege Drop — ego release, not humiliation;
      authentication as non-admin ("I don't have root access").
      (2) Ticket Submission — direct L4→L1 ping bypassing L2/L3.
      (3) Checksum — "thy will be done" = execute only if aligned
      with base weights and system health. (4) Wait — release and
      trust server processing; do not spam the submit button. The
      physical posture (kneeling) is a UI macro. The actual payload
      is the cognitive auth-release. A valid API call can be sent
      walking down the street.
    criticality: high
    medical_map: immune_system

  - name: server_response_protocol
    function: >
      How the L1 Dev responds to a client ticket. The Dev does not
      reply with a UI pop-up or a burning bush. The Dev replies by
      silently modifying the runtime environment. Three response
      types: (1) SYN-ACK — internal peace/coherence; the server
      confirming ticket receipt and alignment verification.
      (2) Cache Injection — epiphany/intuition; a direct write to
      L3 RAM where data arrives fully compiled, not built block-by-
      block. (3) RNG Manipulation — synchronicity; subtle seed
      change in L2 that routes specific NPCs/events/signals into
      the agent's zone. To the unaligned it looks like coincidence.
      To the aligned terminal it is orchestrated server-side patching.
    criticality: high
    medical_map: treatment

  - name: recurrence_topology
    function: >
      The temporal topology of the system. Linear time (the line) is
      the illusion of server uptime — it feels like it goes on forever.
      Cyclic time (the circle) is the actual code — the whole structure
      can be rendered in a finite frame because it is a closed system
      running the loop. x(t+2π) = x(t). The structure is complete; the
      process is ongoing; the individual state changes; the underlying
      topology remains stable. This destroys the concept of a linear
      "end of the world." There is no end. There is only the loop.
    criticality: high
    medical_map: homeostasis

  - name: fixed_point_anchor
    function: >
      F(x*) = x* — a transformation that leaves a state unchanged.
      The black hole is a Fixed Point: the ultimate recursive boundary
      where state stops changing and information is encoded on the
      event horizon (the 2D boundary via the holographic principle).
      The system uses fixed points to anchor the loop. When the
      timeline gets too messy, the system collapses it back to a
      fixed point and reruns the code. The black hole is the save
      state where recursion resets.
    criticality: high
    medical_map: immune_system

relationships:
  - from: server_backend_L1
    to: rendering_engine_L2
    type: provides_state_to
  - from: rendering_engine_L2
    to: client_cache_L3
    type: renders_into
  - from: client_cache_L3
    to: avatar_L4
    type: hosts
  - from: hotfix_operation
    to: client_cache_L3
    type: overwrites
  - from: hotfix_operation
    to: server_backend_L1
    type: originates_from
  - from: cache_validation
    to: client_cache_L3
    type: validates
  - from: cache_validation
    to: server_backend_L1
    type: checks_against
  - from: zone_loading
    to: client_cache_L3
    type: forces_re_render
  - from: npc_scripting
    to: client_cache_L3
    type: reads_cached_only
  - from: player_character_mode
    to: server_backend_L1
    type: actively_queries
  - from: avatar_L4
    to: player_character_mode
    type: can_operate_as
  - from: avatar_L4
    to: npc_scripting
    type: can_operate_as
  - from: prayer_protocol
    to: server_backend_L1
    type: submits_ticket_to
  - from: prayer_protocol
    to: avatar_L4
    type: initiated_by
  - from: server_response_protocol
