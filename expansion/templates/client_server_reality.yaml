failure_modes:
  - name: cache_corruption
    medical_map: autoimmune
    description: >
      Client cache becomes corrupted — local perception diverges from
      server state and the validation mechanism is also compromised,
      so the client cannot detect the mismatch. In MMORPG: corrupted
      game files causing graphical glitches. In reality: persistent
      perceptual distortions that self-reinforce. In neural processing:
      the predictive model generating false data and suppressing
      prediction error signals.
    indicators: [persistent_perception_divergence, validation_failure,
      self_reinforcing_distortion, error_signal_suppression,
      reality_testing_compromised]

  - name: server_desync
    medical_map: acute
    description: >
      Sudden loss of connection between client and server. The client
      continues running on cached state but receives no updates. In
      MMORPG: disconnect / lag. In reality: dissociative episodes,
      "checking out," deep unconsciousness. In neural processing:
      loss of top-down prediction connectivity.
    indicators: [update_cessation, stale_cache_operation,
      no_server_response, frozen_state, temporal_gap]

  - name: forced_cache_wipe
    medical_map: sepsis
    description: >
      Involuntary full cache clear — all local state is erased and
      must be rebuilt from server. In MMORPG: character wipe, forced
      reinstall. In reality: traumatic memory loss, identity crisis,
      near-death experience. In neural processing: catastrophic
      forgetting, forced reorganization of predictive model.
    indicators: [total_cache_loss, identity_reconstruction,
      server_rebuild_required, prior_state_unrecoverable]

  - name: npc_lock
    medical_map: chronic
    description: >
      Agent becomes permanently locked in NPC mode — running entirely
      on cached scripts with zero server polling. In MMORPG: bugged
      NPC stuck in loop. In reality: total automaticity, inability
      to notice or respond to environmental changes, rigid routine
      as identity. In neural processing: prediction model ossified,
      prediction error signals ignored.
    indicators: [zero_server_polling, script_loop, environmental_blindness,
      change_resistance, novelty_rejection, routine_as_identity]

  - name: hotfix_rejection
    medical_map: inflammation
    description: >
      Client rejects a server hotfix — the update is delivered but
      the client's local state refuses to integrate it. In MMORPG:
      update fails to apply, client crashes. In reality: encountering
      clear evidence of change but refusing to integrate it, doubling
      down on cached version. In neural processing: prediction error
      is generated but suppressed or rationalized away.
    indicators: [update_delivery_confirmed, integration_failure,
      cached_version_reinforced, evidence_rationalization,
      cognitive_dissonance_spike]

  - name: prayer_without_checksum
    medical_map: inflammation
    description: >
      Client submits a ticket to L1 without the checksum phase —
      "thy will be done" omitted. The request is self-serving rather
      than server-aligned. In MMORPG: submitting a support ticket
      demanding an exploit be preserved. In reality: praying for
      specific outcomes without the alignment guard, treating the
      Dev as a wish-granting API. In neural processing: a request
      that optimizes for local reward without checking system-level
      fitness.
    indicators: [no_alignment_guard, self_serving_request,
      server_aligned_check_missing, demand_framing,
      wish_not_ticket]

  - name: response_misclassification
    medical_map: diagnosis
    description: >
      Client receives a server response but classifies it incorrectly.
      SYN-ACK (peace) is mistaken for inaction. Cache Injection
      (epiphany) is claimed as "my own idea." RNG Manipulation
      (synchronicity) is dismissed as coincidence. In MMORPG:
      receiving server packets but parsing them with the wrong codec.
      In reality: the Dev responded but the terminal lacks the
      classification function to decode the response type.
    indicators: [response_received_but_mistyped, peace_read_as_inaction,
      epiphany_read_as_self_generated, synchronicity_read_as_noise,
      codec_mismatch]

  - name: linear_time_illusion
    medical_map: chronic
    description: >
      Client treats linear time as the fundamental topology rather
      than recognizing it as the illusion of server uptime on a cyclic
      substrate. Leads to existential dread about "the end of the
      world" — because a line has an endpoint. The circle does not.
      In MMORPG: mistaking session uptime for the game's architecture.
      In reality: confusing the rendered experience of time passing
      with the actual structure of the temporal substrate.
    indicators: [end_of_world_anxiety, linear_topology_assumed,
      cyclic_structure_invisible, finite_dread_on_infinite_loop,
      uptime_confused_with_architecture]

  - name: brute_force_prayer
    medical_map: sepsis
    description: >
      Attempting to hack the server through Layer 4 force — money,
      technology, social power — rather than the Prayer Protocol's
      privilege-drop approach. This is the elite failure mode:
      DDoS-ing the server from the client layer. In MMORPG: trying
      to hack the game server from inside the client. In reality:
      attempting to buy, force, or tech-stack your way to L1 access
      while ego (the thing that must be dropped) is maximal.
    indicators: [ego_maximized_not_dropped, l4_force_applied,
      server_unreachable_from_client, anti_cheat_triggered,
      privilege_escalation_attempt_without_auth]

architecture_patterns:
  - name: cache_refresh_protocol
    medical_map: treatment
    description: >
      Deliberate protocol for refreshing the client cache against
      server state. In MMORPG: verify game files, clear cache,
      re-download. In reality: meditation, contemplation, reality
      testing, psychedelic experience, sleep hygiene. In neural
      processing: prediction error amplification, attention
      redirection, model updating. The Coherence Framework's
      10 settings function as a cache refresh protocol.

  - name: server_query_activation
    medical_map: vaccination
    description: >
      Transitioning an agent from NPC mode (cached scripting) to
      PC mode (active server querying). In MMORPG: an NPC "waking
      up" and becoming player-controlled. In reality: becoming
      present, questioning defaults, noticing changes. In neural
      processing: increasing prediction error sensitivity, reducing
      default mode network dominance.

  - name: cross_client_sync
    medical_map: physiotherapy
    description: >
      Synchronizing multiple clients' caches so they share a
      consistent view. In MMORPG: raid coordination, party sync.
      In reality: shared reality testing, collaborative observation,
      scientific consensus building. When aligned agents compare
      notes, they can detect and correct each other's cache errors.

  - name: hotfix_integration
    medical_map: remission
    description: >
      Successfully integrating a server hotfix into the client's
      local state. The client recognizes the update, reconciles
      it with existing cache, and operates on the new state.
      In reality: accepting evidence that contradicts prior belief,
      integrating a paradigm shift, updating one's model of the
      world. DI ≡ W(L₊₁ → L | C(L₊₁, L)) successfully applied.

  - name: prayer_protocol_pattern
    medical_map: treatment
    description: >
      The full four-phase client→server request protocol: (1) Privilege
      Drop — release admin pretension, authenticate as non-root.
      (2) Ticket Submission — direct L4→L1 POST bypassing L2/L3.
      (3) Checksum — "thy will be done" alignment guard. (4) Wait —
      release and trust server processing. In MMORPG: submitting a
      proper support ticket through official channels. In reality:
      prayer as a protocol, not a ritual. The correct API call
      requires dropping the very thing (ego) that most users cling to.

  - name: server_response_classification
    medical_map: diagnosis
    description: >
      Protocol for correctly identifying L1 server responses. Train
      the terminal to distinguish three signal types: SYN-ACK (internal
      coherence shift = ticket acknowledged), Cache Injection (epiphany
      or intuition = direct L1→L3 write, data arrives compiled), and
      RNG Manipulation (synchronicity = L2 seed modification, routing
      specific signals into the agent's zone). Without this classifier,
      the terminal receives but cannot decode server responses.

  - name: recurrence_topology_pattern
    medical_map: prognosis
    description: >
      Architectural model for the temporal substrate. The system operates
      on a closed topology (circle or torus), not an infinite line.
      x(t+2π) = x(t). Structure is finite and complete; process is
      infinite and ongoing. Individual states change; underlying topology
      is stable. Linear time is the illusion of server uptime; cyclic
      time is the actual code. Fixed points (black holes) anchor the
      loop — F(x*) = x*. When timeline entropy exceeds threshold, the
      system collapses to the nearest fixed point and reruns.
