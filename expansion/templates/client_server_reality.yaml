    type: originates_from
  - from: server_response_protocol
    to: client_cache_L3
    type: writes_to
  - from: server_response_protocol
    to: rendering_engine_L2
    type: modifies_seed_in
  - from: recurrence_topology
    to: server_backend_L1
    type: describes_structure_of
  - from: fixed_point_anchor
    to: recurrence_topology
    type: anchors

invariants:
