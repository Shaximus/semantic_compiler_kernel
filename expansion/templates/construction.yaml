domain: construction
version: 1.0
description: Buildings, infrastructure, and physical engineering projects.
components:
  - name: foundation
    function: bear and distribute structural load
    criticality: high
  - name: structural_frame
    function: maintain integrity of the whole
    criticality: high
  - name: building_envelope
    function: separate interior from environment
    criticality: high
  - name: utilities
    function: circulate power, water, and air
    criticality: medium
  - name: inspection
    function: verify code and safety compliance
    criticality: high
relationships:
  - from: foundation
    to: structural_frame
    type: supports
  - from: inspection
    to: structural_frame
    type: guards
  - from: building_envelope
    to: utilities
    type: protects
invariants:
  - load paths must be continuous to ground
  - inspection sign-off must precede occupancy
  - >
    CONSCIOUSNESS_COGNITION_LINK: The structural substrate
    (geology, foundation, load-bearing frame) is consciousness;
    the building's function, occupancy, and appearance are
    cognition (terminal output). The structure exists before and
    independent of its use. Renovation = terminal reconfiguration
    on same substrate. Demolition = terminal teardown, substrate
    persists (land). Building code = system prompt constraining
    terminal behavior. Architect's vision = initial system prompt
    written onto substrate. Cross-ref: consciousness_cognition.yaml [DERIVED]
  - >
    CLIENT_SERVER_LINK: Foundation + structural frame = server
    (L1); building systems (HVAC, electrical, plumbing) =
    rendering engine (L2); occupant experience / interior state =
    client cache (L3); individual rooms / occupants = avatars
    (L4). Emergency repair = hotfix. Deferred maintenance =
    cache-server desync accumulation. Building inspection =
    cache validation against server state. Retrofit / seismic
    upgrade = server-side patch. Fire compartmentalization =
    cache isolation protocol. Cross-ref: client_server_reality.yaml [DERIVED]
failure_modes:
  - name: progressive_collapse
    medical_map: metastasis
    description: local failure propagates through the structure
    indicators: [crack_propagation, load_redistribution]
  - name: deferred_maintenance
    medical_map: chronic
    description: accumulating small defects degrade integrity
    indicators: [corrosion, inspection_backlog]
  - name: water_ingress
    medical_map: pathogen
    description: envelope breach admits destructive moisture
    indicators: [leaks, mold_growth]
architecture_patterns:
  - name: redundancy_in_load_paths
    medical_map: immune_system
    description: alternate supports absorb single-point failures
  - name: compartmentalization
    medical_map: quarantine
    description: fire and flood barriers contain damage
