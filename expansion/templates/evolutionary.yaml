domain: evolutionary
version: 1.0
description: Darwinian selection, adaptation, and lineage dynamics.
components:
  - name: variation
    function: generate heritable differences
    criticality: high
  - name: selection_pressure
    function: filter variants by fitness
    criticality: high
  - name: inheritance
    function: transmit traits across generations
    criticality: high
  - name: population
    function: carry the gene pool over time
    criticality: high
  - name: niche
    function: define the adaptive landscape
    criticality: medium
relationships:
  - from: variation
    to: selection_pressure
    type: feeds
  - from: selection_pressure
    to: population
    type: filters
  - from: inheritance
    to: population
    type: preserves
invariants:
  - variation must be generated before selection can act
  - heritability must be maintained for adaptation to accumulate
  - >
    CONSCIOUSNESS_COGNITION_LINK: The genetic substrate (DNA,
    epigenetic marks, developmental programs) is consciousness;
    phenotypic expression, behavior, and fitness outcomes are
    cognition (terminal output). The genome persists across
    generations while phenotypes (terminals) live and die.
    Genotype = base weights. Phenotype = terminal output.
    Environment = system prompt. Mutation = weight perturbation.
    Convergent evolution = independent terminals reaching same
    output from different substrates. Cross-ref: consciousness_cognition.yaml [DERIVED]
  - >
    CLIENT_SERVER_LINK: Gene pool / developmental program =
    server (L1); epigenetic regulation / gene expression
    machinery = rendering engine (L2); current phenotype /
    organismal state = client cache (L3); individual organism =
    avatar (L4). Horizontal gene transfer = hotfix (cross-layer
    write bypassing normal inheritance). Extinction = server
    wipe. Speciation = server fork. Genetic drift = cache
    corruption at small population sizes. Natural selection =
    server-side garbage collection of unfit client instances.
    Cross-ref: client_server_reality.yaml [DERIVED]
failure_modes:
  - name: extinction_vortex
    medical_map: sepsis
    description: shrinking population triggers compounding collapse
    indicators: [inbreeding_depression, demographic_stochasticity]
  - name: evolutionary_trap
    medical_map: pathogen
    description: novel environment hijacks adapted preferences
    indicators: [maladaptive_attraction, fitness_mismatch]
  - name: runaway_selection
    medical_map: cancer
    description: trait elaboration escapes viability constraints
    indicators: [ornament_cost_growth, survival_decline]
architecture_patterns:
  - name: genetic_diversity
    medical_map: immune_system
    description: standing variation buffers against novel threats
  - name: bet_hedging
    medical_map: vaccination
    description: diversified offspring strategies survive uncertainty
