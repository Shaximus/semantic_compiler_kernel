domain: remote_attestation
version: 1.0
description: >-
  Hardware-backed remote attestation and trust appraisal following the IETF RATS
  architecture (RFC 9334): separating Attester, Verifier, Relying Party,
  Endorser, Reference Value Provider, freshness nonces, and continuous TOCTOU
  bound enforcement across TPM / StrongBox / TEE / confidential-compute roots.
components:
  - name: hardware_root_of_trust
    function: immutable silicon anchor (TPM / StrongBox / TEE) sealing endorsement keys, boot measurements, and monotonic anti-rollback fuses
    criticality: high
    medical_map: homeostasis
  - name: attester
    function: captures local platform and workload measurements and signs cryptographic Evidence bound to a freshness challenge
    criticality: high
    medical_map: diagnosis
  - name: endorser
    function: hardware or silicon authority issuing Endorsements that bind attestation public keys to genuine manufacturing roots
    criticality: high
    medical_map: vaccination
  - name: reference_value_provider
    function: supplies authorized baseline hashes and security-patch expectations (Reference Values) for measured components
    criticality: high
    medical_map: prognosis
  - name: verifier
    function: appraises Evidence using Endorsements, Reference Values, and Appraisal Policy to emit short-lived Attestation Results
    criticality: high
    medical_map: immune_system
  - name: relying_party
    function: gates secret release, credential issuance, or privileged session access strictly on verified fresh Attestation Results
    criticality: high
    medical_map: quarantine
  - name: freshness_nonce_service
    function: mints unpredictable, time-bounded nonces included inside Evidence signatures to defeat replay attacks
    criticality: high
    medical_map: treatment
  - name: attestation_watchdog
    function: bounds Time-of-Check to Time-of-Use (TOCTOU) windows by enforcing short token TTLs and periodic re-attestation heartbeats
    criticality: medium
    medical_map: homeostasis
relationships:
  - from: hardware_root_of_trust
    to: attester
    type: roots_measurements_for
  - from: endorser
    to: verifier
    type: certifies_keys_for
  - from: reference_value_provider
    to: verifier
    type: supplies_baselines_to
  - from: freshness_nonce_service
    to: attester
    type: challenges
  - from: attester
    to: verifier
    type: submits_evidence_to
  - from: verifier
    to: relying_party
    type: issues_attestation_results_to
  - from: attestation_watchdog
    to: relying_party
    type: revokes_stale_grants_for
invariants:
  - "RFC 9334 separates Attester, Verifier, and Relying Party so policy appraisal relies on endorsed hardware Evidence rather than self-reported software claims [RFC9334]"
  - "Every Evidence quote must bind an unpredictable freshness nonce or epoch handle generated by the Verifier/Relying Party to prevent replay of previously healthy states [RFC9334]"
  - "In the Passport model cached Attestation Results remain valid longer, creating wider TOCTOU exposure than Background-Check challenge-response appraisal unless TTLs stay tight [RFC9334]"
  - "Reference values without hardware monotonic anti-rollback counters cannot stop downgrade attacks to older binaries whose hashes remain signed [DERIVED]"
  - >
    CONSCIOUSNESS_COGNITION_LINK: The immutable hardware root of trust,
    silicon endorsements, and reference value baselines represent
    consciousness (ground truth substrate), while cached attestation
    passports and relying-party session beliefs represent cognition
    (terminal output). A stale cached passport creates TOCTOU divergence
    after runtime compromise. Cross-ref: consciousness_cognition.yaml [DERIVED]
  - >
    CLIENT_SERVER_LINK: Hardware root of trust + Endorser + Reference Value
    Provider = server (L1); Verifier appraisal policy = rendering engine (L2);
    Attestation Result passport / relying-party token cache = client cache (L3);
    attested workloads/devices = avatars (L4). Freshness nonce challenge =
    PC query bypassing stale L3 passport cache. Cross-ref: client_server_reality.yaml [DERIVED]
failure_modes:
  - name: replay_stale_evidence
    medical_map: pathogen
    description: missing or reused freshness nonce allows replaying an archived healthy Evidence quote from a compromised device
    indicators:
      - replay_stale_evidence
      - missing_freshness_nonce
      - quote_replay
  - name: toctou_post_check_compromise
    medical_map: acute
    description: excessive Attestation Result lifetime allows workload compromise after Time-of-Check while Time-of-Use access stays open
    indicators:
      - toctou_post_check_compromise
      - stale_passport_ttl
      - toctou_gap
  - name: rollback_downgrade_attack
    medical_map: autoimmune
    description: lacking hardware anti-rollback counters permits booting legacy vulnerable firmware whose old measurements still pass appraisal
    indicators:
      - rollback_downgrade_attack
      - unrevoked_legacy_reference
      - downgrade_boot
  - name: self_asserted_root_bypass
    medical_map: sepsis
    description: verifier accepts unendorsed or self-signed claims without chaining back to a vendor-endorsed hardware root
    indicators:
      - self_asserted_root_bypass
      - missing_endorsement_chain
      - unanchored_quote
architecture_patterns:
  - name: background_check_fresh_challenge
    medical_map: immune_system
    description: route fresh nonce-bound Evidence straight through the Relying Party to the Verifier per sensitive transaction
  - name: short_ttl_continuous_reattestation
    medical_map: treatment
    description: pair narrow Attestation Result expiration with watchdog heartbeat re-appraisal to close TOCTOU windows
  - name: hardware_monotonic_rollback_fuse
    medical_map: homeostasis
    description: bind security-version floors to non-volatile hardware fuses before releasing decryption keys
  - name: vendor_endorsed_reference_appraisal
    medical_map: quarantine
    description: require independent Endorsements plus current Reference Values before issuing Attestation Results
