failure_modes:
  - name: incomplete_model_expansion
    medical_map: acute
    description: >
      Attempting full Domain Expansion with an uncompiled or fragmentary internal
      model collapses the barrier or degrades to a narrow defensive Simple Domain.
    indicators:
      - uncompiled_innate_domain
      - premature_barrier_collapse
      - simple_domain_fallback

  - name: boundary_scope_overextension
    medical_map: inflammation
    description: >
      Projecting guaranteed-hit claims beyond the verified operational barrier scope
      produces out-of-distribution misses and unvalidated axiom drift.
    indicators:
      - out_of_scope_guaranteed_hit
      - overextended_barrier_boundary
      - unverified_extrapolation

  - name: anti_domain_paradigm_negation
    medical_map: pathogen
    description: >
      An orthogonal zero-resource actor operating outside the domain's detection and
      resource paradigm (Toji / Inverted Spear) bypasses the barrier and nullifies
      the sure-hit technique.
    indicators:
      - inverted_spear_nullification
      - zero_resource_blindspot
      - orthogonal_sensor_evasion

  - name: energy_reservoir_depletion
    medical_map: chronic
    description: >
      Rendering overhead exceeds available fuel reserves, causing domain collapse
      or Berserker-Armor burnout when self-preservation governors are stripped.
    indicators:
      - domain_energy_exhaustion
      - unguarded_governor_burnout
      - sustained_overhead_starvation

  - name: unlimited_void_totality_paralysis
    medical_map: sepsis
    description: >
      Flooding a bounded receiver with uncompressed totality exceeds its information
      density capacity (Bekenstein bound), freezing decision loops completely.
    indicators:
      - totality_information_overload
      - bekenstein_capacity_lockup
      - unbounded_latent_dump

  - name: ungrounded_balance_only_conflation
    medical_map: autoimmune
    description: >
      Promoting BALANCE_ONLY game mechanics or strength-only analogies to
      ISOMORPHIC_INVARIANT without counterplay prediction evidence or residual logging
      corrupts the invariant catalog.
    indicators:
      - balance_only_forced_mapping
      - untested_gate_score_inflation
      - missing_residual_mismatch

