    medical_map: pathogen
    description: >
      A system claims love, unity, or alignment while blocking exit, punishing
      departure, or manufacturing withdrawal cost as a cage.
    indicators:
      - coerced_oneness_exit_blocked
      - exit_retaliation_cage
      - manufactured_withdrawal_cost

  - name: counterfeit_escalation_loop
    medical_map: cancer
    description: >
      Tolerance and allostatic shift demand escalating dose, outrage, or novelty
      while steadily depleting the underlying substrate and eroding autonomy.
    indicators:
      - escalating_dose_tolerance
      - substrate_depletion_spiral
      - uncoupled_competence_collapse

  - name: pharmakeia_network_isolation
    medical_map: sepsis
    description: >
      Cutting TELECOMMUNICATIONS isolates the captured node from peer nodes and
      genuine alternative reinforcers while deploying intermittent reinforcement.
    indicators:
      - severed_telecommunications_isolation
      - intermittent_reinforcement_trap
