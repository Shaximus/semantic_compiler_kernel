      Internal valuation and reinforcement substrate calibrated at constant dose under
      genuine coupling or distorted by tolerance and allostatic escalation under capture.
    criticality: high
    medical_map: homeostasis

  - name: exit_sovereignty_boundary
    function: >
      Hard V5 sovereignty boundary guaranteeing that any node may uncouple without
      force, punishment, or manufactured exit cost.
    criticality: high
    medical_map: immune_system

  - name: informed_consent_gate
    function: >
      Transparency boundary ensuring every node knows what it is coupling to before
      entering or renewing integration.
    criticality: high
    medical_map: immune_system

  - name: discriminator_evaluator
    function: >
      Adjudicator enforcing the four surviving SC-SB-001 discriminators (escalation,
      substrate, agency, exit) while rejecting removed discriminators (onset speed,
      tolerance vs sensitization, withdrawal direction).
    criticality: high
    medical_map: diagnosis

  - name: genuine_reinforcer_bus
    function: >
      Direct exposure pathway supplying a non-escalating, substrate-sustaining genuine
      alternative reinforcer to extinguish counterfeit capture without coercion.
    criticality: high
    medical_map: treatment

  - name: recalibration_comparator
    function: >
      Direct experiential comparison loop contrasting genuine and counterfeit inputs
      so the captured architecture updates beyond verbal argument alone.
    criticality: high
    medical_map: physiotherapy

  - name: uncoupled_competence_verifier
    function: >
      Secure-base benchmark measuring whether coupling raises or erodes a node's
      autonomous capability after uncoupling.
    criticality: high
    medical_map: prognosis

  - name: grief_vs_coercion_separator
    function: >
      Waste-removal and separation classifier distinguishing natural bond-scaled grief
      (resilient trajectory, agency-preserving) from partner-imposed coercion.
    criticality: medium
    medical_map: remission

  - name: network_telecommunications_mesh
    function: >
      External relational channels preserving peer connectivity so isolation cannot
      sever reference points or trap a node inside a counterfeit loop.
    criticality: high
    medical_map: vaccination

  - name: bootstrapper_surrender_verifier
    function: >
      Creator-in-the-loop audit verifying whether an instantiator entering as a
      participant surrendered exit-blocking locks and hidden privileges rather than
      running surveillance from inside.
    criticality: high
    medical_map: quarantine

relationships:
