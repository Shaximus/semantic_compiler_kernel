  - from: genuine_reinforcer_bus
    to: recalibration_comparator
    type: delivers_direct_alternative_exposure
  - from: recalibration_comparator
    to: reward_architecture_core
    type: extinguishes_counterfeit_capture
  - from: grief_vs_coercion_separator
    to: exit_sovereignty_boundary
    type: separates_grief_from_retaliation
  - from: network_telecommunications_mesh
    to: recalibration_comparator
    type: preserves_external_reference_channels
  - from: bootstrapper_surrender_verifier
    to: exit_sovereignty_boundary
    type: audits_creator_privilege_surrender

