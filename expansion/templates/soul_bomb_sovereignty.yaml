  Online Lineup Exit-Sovereignty & Bootstrapper Synthesis (SC-LU-SAO-LINEUP-001 and
  character decodes Kirito, Asuna, Yui, Alice, Cardinal). Formalizes the four surviving
  discriminators separating genuine sovereignty-preserving coupling from counterfeit
  capture (escalation, substrate depletion, agency/uncoupled competence, and exit),
  rejects removed discriminators (onset speed, tolerance vs sensitization, withdrawal
  direction / P5 infinite withdrawal), distinguishes natural separation grief from
  imposed coercion, requires direct exposure to a genuine alternative reinforcer for
  recalibration, enforces the Cosmological scale sovereignty-absent residual, and
  adjudicates creator-enters-the-loop bootstrapper surrender and action-over-team exit
