domain: social
version: 1.0
description: Societies, communities, and collective human behavior.
components:
  - name: norms
    function: encode expected behavior
    criticality: high
  - name: institutions
    function: formalize roles and coordination
    criticality: high
  - name: trust_networks
    function: enable cooperation between strangers
    criticality: high
  - name: communication_media
    function: spread information and narratives
    criticality: medium
  - name: subcultures
    function: experiment with alternative norms
    criticality: low
relationships:
  - from: norms
    to: institutions
    type: shapes
  - from: trust_networks
    to: institutions
    type: supports
  - from: communication_media
    to: norms
    type: influences
invariants:
  - trust must be repairable after violation
  - norms must allow legitimate dissent
  - >
    CONSCIOUSNESS_COGNITION_LINK: Shared cultural substrate
    (language, deep norms, collective memory) is consciousness;
    individual social behavior is cognition (terminal output).
    One cultural substrate → many individuals (multiplexing).
    Upbringing/education is the system prompt. Cultural water you
    swim in = substrate you cannot perceive from the terminal.
    Cross-ref: consciousness_cognition.yaml [DERIVED]
  - >
    CLIENT_SERVER_LINK: Deep cultural substrate = server (L1);
    institutions/norms = rendering engine (L2); individual
    perception of society = client cache (L3); social role =
    avatar (L4). Paradigm shifts = server hotfixes. Cultural
    lag = cache mismatch. Conformity without questioning =
    NPC mode. Cross-ref: client_server_reality.yaml [DERIVED]
failure_modes:
  - name: polarization
    medical_map: autoimmune
    description: the society treats internal groups as threats
    indicators: [out_group_hostility, dehumanizing_language]
  - name: misinformation_cascade
    medical_map: pathogen
    description: false narratives replicate through the media layer
    indicators: [viral_falsehoods, source_laundering]
  - name: trust_collapse
    medical_map: sepsis
    description: systemic loss of confidence in all institutions
    indicators: [institutional_defection, conspiracy_proliferation]
architecture_patterns:
  - name: bridging_institutions
    medical_map: immune_system
    description: cross-cutting groups reconnect polarized factions
  - name: norm_vaccination
    medical_map: vaccination
    description: controlled exposure to weak misinformation builds resistance
