domain: economic
version: 1.0
description: Markets, monetary systems, and resource allocation.
components:
  - name: markets
    function: discover prices and allocate resources
    criticality: high
  - name: central_bank
    function: regulate money supply and stability
    criticality: high
  - name: firms
    function: produce goods and services
    criticality: high
  - name: households
    function: supply labor and consume output
    criticality: medium
  - name: regulators
    function: enforce fair play and transparency
    criticality: high
relationships:
  - from: central_bank
    to: markets
    type: regulates
  - from: regulators
    to: firms
    type: guards
  - from: households
    to: firms
    type: feeds
invariants:
  - contracts must be enforceable
  - money supply must track productive capacity over time
  - >
    CONSCIOUSNESS_COGNITION_LINK: The productive substrate
    (natural resources, human capital, accumulated knowledge) is
    consciousness; market prices, GDP, and financial instruments
    are cognition (terminal output). The substrate generates
    value; markets merely render it visible. Bubble = terminal
    output disconnected from substrate reality. Fiat currency =
    system prompt (shared agreement configuring how terminals
    interpret substrate value). Cross-ref: consciousness_cognition.yaml [DERIVED]
  - >
    CLIENT_SERVER_LINK: Productive capacity (resources, labor,
    technology) = server (L1); institutional framework (banking,
    regulation, contract law) = rendering engine (L2); market
    perception / price discovery = client cache (L3); individual
    firms / consumers = avatars (L4). Central bank intervention
    = hotfix. Market crash = cache invalidation cascade. Insider
    trading = unauthorized server-state read. Black market =
    shadow client bypassing rendering engine. [DERIVED]
    Cross-ref: client_server_reality.yaml
failure_modes:
  - name: asset_bubble
    medical_map: cancer
    description: prices grow beyond underlying value without feedback
    indicators: [leverage_growth, speculative_volume]
  - name: hyperinflation
    medical_map: sepsis
    description: systemic loss of confidence in the currency
    indicators: [price_spirals, currency_flight]
  - name: stagflation
    medical_map: chronic
    description: persistent stagnation combined with inflation
    indicators: [rising_unemployment, rising_prices]
architecture_patterns:
  - name: lender_of_last_resort
    medical_map: quarantine
    description: contain liquidity crises before contagion spreads
  - name: automatic_stabilizers
    medical_map: homeostasis
    description: countercyclical mechanisms dampen shocks
