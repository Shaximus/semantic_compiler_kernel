domain: military
version: 1.0
description: Armed forces, defense strategy, and conflict systems.
components:
  - name: command
    function: direct strategy and authorize force
    criticality: high
  - name: logistics
    function: sustain forces with materiel and supply
    criticality: high
  - name: intelligence
    function: gather and assess threat information
    criticality: high
  - name: combat_units
    function: execute operations on the ground
    criticality: high
  - name: civilian_oversight
    function: constrain force under political authority
    criticality: high
relationships:
  - from: command
    to: combat_units
    type: directs
  - from: intelligence
    to: command
    type: informs
  - from: logistics
    to: combat_units
    type: supports
  - from: civilian_oversight
    to: command
    type: guards
invariants:
  - use of force must remain under civilian control
  - rules of engagement must be followed
  - >
    CONSCIOUSNESS_COGNITION_LINK: The doctrine / strategic culture
    (accumulated military knowledge, war-fighting philosophy) is
    consciousness; tactical decisions, orders, and engagements are
    cognition (terminal output). Doctrine persists across wars
    while campaigns (terminals) begin and end. Each unit's ROE =
    system prompt. Intelligence failure = terminal operating on
    corrupted cache, not substrate failure. Fog of war = inherent
    substrate blindness at the terminal layer. [DERIVED]
    Cross-ref: consciousness_cognition.yaml
  - >
    CLIENT_SERVER_LINK: Grand strategy / doctrine = server (L1);
    operational planning / C2 infrastructure = rendering engine
    (L2); tactical situational awareness / common operational
    picture = client cache (L3); individual units / soldiers =
    avatars (L4). Strategic directive = hotfix. OODA loop =
    cache refresh cycle. Surprise attack = cache bypass (action
    before client can sync). Guerrilla warfare = avatars
    operating without server connection. Electronic warfare =
    rendering engine disruption. Cross-ref: client_server_reality.yaml [DERIVED]
failure_modes:
  - name: mission_creep
    medical_map: cancer
    description: objectives expand beyond mandate without review
    indicators: [scope_expansion, undefined_end_state]
  - name: intelligence_failure
    medical_map: autoimmune
    description: assessment filters or attacks the truth it needs
    indicators: [cherry_picked_estimates, politicized_analysis]
  - name: logistics_collapse
    medical_map: acute
    description: supply failure disables forces rapidly
    indicators: [fuel_shortages, attrition_of_reserves]
architecture_patterns:
  - name: defense_in_depth
    medical_map: immune_system
    description: layered positions absorb and slow penetration
  - name: strategic_reserves
    medical_map: homeostasis
    description: held-back capacity restores equilibrium after shock
