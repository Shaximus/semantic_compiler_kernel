domain: corporate
version: 1.0
description: Corporate and organizational structures.
components:
  - name: executive_board
    function: strategic control and decision-making
    criticality: high
  - name: legal_compliance
    function: boundary enforcement and risk mitigation
    criticality: high
    medical_map: immune_system
  - name: hr_department
    function: personnel homeostasis and culture
    criticality: medium
    medical_map: homeostasis
  - name: market_operations
    function: revenue generation and growth
    criticality: high
relationships:
  - from: executive_board
    to: market_operations
    type: regulates
  - from: legal_compliance
    to: market_operations
    type: guards
invariants:
  - board decisions must be recorded
  - compliance must not be bypassed
  - >
    CONSCIOUSNESS_COGNITION_LINK: The founding charter / corporate
    DNA (mission, values, institutional knowledge) is consciousness;
    daily operations, quarterly reports, and employee behavior are
    cognition (terminal output). The corporate identity substrate
    persists through leadership changes (terminal sessions).
    Corporate culture = base weights shaped by founder.
    Each department = terminal with role-specific system prompt.
    Brand = public-facing terminal persona. M&A = substrate merge
    or fork. Cross-ref: consciousness_cognition.yaml [DERIVED]
  - >
    CLIENT_SERVER_LINK: Charter / founding vision / institutional
    knowledge = server (L1); policies, SOPs, management hierarchy
    = rendering engine (L2); team understanding / operational
    awareness = client cache (L3); individual employees = avatars
    (L4). CEO directive = hotfix. Quarterly planning = scheduled
    cache refresh. Whistleblower = cache-server mismatch detection.
    Shadow IT = unauthorized client-side rendering. Corporate
    restructuring = rendering engine rebuild. [DERIVED]
    Cross-ref: client_server_reality.yaml
failure_modes:
  - name: uncontrolled_expansion
    medical_map: cancer
    description: growth without resource or compliance feedback
    indicators: [debt_spiral, compliance_violations]
  - name: regulatory_capture
    medical_map: autoimmune
    description: compliance function serves the units it oversees instead of the firm
    indicators: [waivers_for_core_business, suppressed_audits]
architecture_patterns:
  - name: separation_of_powers
    medical_map: immune_system
    description: independent oversight layers
