domain: government
version: 1.0
description: State institutions and public administration systems.
components:
  - name: legislature
    function: create and amend laws
    criticality: high
  - name: executive
    function: implement policy and administer services
    criticality: high
  - name: judiciary
    function: interpret law and resolve disputes
    criticality: high
  - name: civil_service
    function: maintain continuity of operations
    criticality: medium
  - name: election_system
    function: renew legitimacy through citizen input
    criticality: high
relationships:
  - from: legislature
    to: executive
    type: directs
  - from: judiciary
    to: executive
    type: guards
  - from: election_system
    to: legislature
    type: feeds
invariants:
  - no branch may exercise another branch's core power
  - elections must be periodic and verifiable
  - >
    CONSCIOUSNESS_COGNITION_LINK: The constitutional substrate
    (founding document, social contract, sovereignty source) is
    consciousness; legislation, executive orders, and judicial
    opinions are cognition (terminal output). The constitution
    persists while governments (terminals) change. Citizen body
    = base weights. Each administration = new terminal session
    with same substrate. Unconstitutional action = terminal
    contradicting substrate. Cross-ref: consciousness_cognition.yaml [DERIVED]
  - >
    CLIENT_SERVER_LINK: Constitutional order = server (L1);
    institutional frameworks (branches, agencies) = rendering
    engine (L2); public perception / political discourse =
    client cache (L3); individual officials / citizens = avatars
    (L4). Constitutional amendment = server-side patch.
    Executive order = hotfix (L2 write). Propaganda = cache
    poisoning (L3 manipulation without L1 change). Revolution
    = server crash and reboot. Election = scheduled cache
    refresh from server state. Cross-ref: client_server_reality.yaml [DERIVED]
failure_modes:
  - name: authoritarian_consolidation
    medical_map: cancer
    description: one branch captures the checks meant to constrain it
    indicators: [court_packing, emergency_power_renewal]
  - name: institutional_gridlock
    medical_map: chronic
    description: persistent inability to pass or execute policy
    indicators: [budget_stalemates, unfilled_appointments]
  - name: corruption_spread
    medical_map: metastasis
    description: localized graft migrates across institutions
    indicators: [procurement_anomalies, patronage_networks]
architecture_patterns:
  - name: checks_and_balances
    medical_map: immune_system
    description: mutual oversight between independent branches
  - name: federal_subsidiarity
    medical_map: homeostasis
    description: decisions taken at the lowest competent level
