[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-compiler-kernel"
version = "4.1.0"
description = "Reflexion Semantic Compiler — evidence-conditioned cross-domain semantic compilation pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jsonschema>=4.0",
    "PyYAML>=6.0",
    "cryptography>=50.0.2,<51",
]

[project.urls]
Homepage = "https://reflexionsoftware.com"
Repository = "https://github.com/Shaximus/semantic_compiler_kernel"
Issues = "https://github.com/Shaximus/semantic_compiler_kernel/issues"
Discussions = "https://github.com/Shaximus/semantic_compiler_kernel/discussions"
"Commercial License" = "https://github.com/Shaximus/semantic_compiler_kernel/blob/main/COMMERCIAL_LICENSE.md"
Funding = "https://buymeacoffee.com/kingsleywmk"

[project.optional-dependencies]
test = ["pytest>=7.0"]
# PKCS#11 signer and RFC 3161 helpers. Not required to import sov_trade.
# GitHub CI installs these (plus apt softhsm2 and opensc) and sets
# SOV_TRADE_REQUIRE_FUNCTIONAL=1 so a missing dependency fails the run.
sov-trade = [
    "python-pkcs11==0.10.1",
    "asn1crypto==1.5.1",
]
# Property/fuzz tests and static checks for SC-SOV-TRADE-001 (make verify).
sov-trade-test = [
    "pytest>=7.0",
    "hypothesis==6.170.22; python_version >= '3.11'",
    "hypothesis==6.168.5; python_version < '3.11'",
]
sov-trade-static = [
    "ruff==0.17.6",
    "mypy==2.4.1",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
package-dir = { "semantic_compiler" = "." }
packages = [
    "semantic_compiler",
    "semantic_compiler.core",
    "semantic_compiler.extraction",
    "semantic_compiler.gates",
    "semantic_compiler.modes",
    "semantic_compiler.registry",
    "semantic_compiler.translation",
    "semantic_compiler.expansion",
    "semantic_compiler.expansion.advisor",
    "semantic_compiler.expansion.gem_decode",
    "semantic_compiler.expansion.gem_forge",
    "semantic_compiler.expansion.isomorphism",
    "semantic_compiler.expansion.ontology",
    "semantic_compiler.expansion.pathology",
    "semantic_compiler.expansion.reconstruction",
    "semantic_compiler.expansion.registry",
    "semantic_compiler.expansion.schema",
    "semantic_compiler.expansion.consciousness",
    "semantic_compiler.sov_trade",
]

[tool.setuptools.package-data]
"semantic_compiler.expansion" = ["schemas/*.json", "templates/*.yaml"]
"semantic_compiler.expansion.gem_forge" = ["data/*.json"]
"semantic_compiler" = ["schemas/*.json", "CANARY.json", "COMMERCIAL_LICENSE.md"]
